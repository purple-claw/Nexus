<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1A1A2E" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bgGradLogo)" />
  <g transform="translate(60, -30) scale(0.6)">
    <rect x="0" y="0" width="500" height="500" rx="100" fill="url(#bgGradLogo)" />
    <line x1="150" y1="130" x2="130" y2="370" stroke="url(#lineGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" opacity="0.6"/>
    <line x1="350" y1="130" x2="370" y2="370" stroke="url(#lineGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" opacity="0.6"/>
    <line x1="150" y1="130" x2="370" y2="370" stroke="url(#lineGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />
    <line x1="150" y1="130" x2="250" y2="250" stroke="#A78BFA" stroke-width="6" stroke-linecap="round" opacity="0.4" stroke-dasharray="8 8"/>
    <line x1="350" y1="130" x2="250" y2="250" stroke="#A78BFA" stroke-width="6" stroke-linecap="round" opacity="0.4" stroke-dasharray="8 8"/>
    <line x1="130" y1="370" x2="250" y2="250" stroke="#A78BFA" stroke-width="6" stroke-linecap="round" opacity="0.4" stroke-dasharray="8 8"/>
    <line x1="370" y1="370" x2="250" y2="250" stroke="#A78BFA" stroke-width="6" stroke-linecap="round" opacity="0.4" stroke-dasharray="8 8"/>
    <circle cx="250" cy="250" r="45" fill="none" stroke="url(#nodeGrad)" stroke-width="8" filter="url(#softGlow)" />
    <circle cx="250" cy="250" r="25" fill="url(#nodeGrad)" />
    <circle cx="250" cy="250" r="12" fill="#0B0F19" />
    <circle cx="150" cy="130" r="18" fill="#0B0F19" stroke="#4FACFE" stroke-width="6" />
    <circle cx="350" cy="130" r="18" fill="#0B0F19" stroke="#4FACFE" stroke-width="6" />
    <circle cx="130" cy="370" r="18" fill="#0B0F19" stroke="#4FACFE" stroke-width="6" />
    <circle cx="370" cy="370" r="18" fill="#0B0F19" stroke="#4FACFE" stroke-width="6" />
    <circle cx="100" cy="200" r="4" fill="#00F2FE" filter="url(#glow)" />
    <circle cx="400" cy="300" r="5" fill="#A78BFA" filter="url(#glow)" />
    <circle cx="220" cy="420" r="3" fill="#4FACFE" filter="url(#glow)" />
    <circle cx="320" cy="80" r="4" fill="#00F2FE" filter="url(#glow)" />
    <circle cx="80" cy="320" r="3" fill="#A78BFA" filter="url(#glow)" />
  </g>
  <text x="420" y="210" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="96" fill="url(#textGrad)" letter-spacing="8">NEXUS</text>
  <text x="420" y="270" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="300" font-size="24" fill="#A78BFA" letter-spacing="8">EDUTECH LEARNING PLATFORM</text>
</svg>
