{% extends 'base.html' %}
{% block content %}
<div class="max-w-6xl mx-auto" x-data="calendarApp()">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-zinc-900 dark:text-white tracking-tight">Study Calendar</h1>
            <p class="text-sm text-zinc-500 dark:text-zinc-400 mt-1">Plan your study days by assigning topics</p>
        </div>
        <div class="flex items-center gap-3">
            <button @click="changeMonth(-1)" class="p-2 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-500 dark:text-zinc-400 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <h2 class="text-base font-semibold text-zinc-900 dark:text-white w-40 text-center" x-text="monthYear"></h2>
            <button @click="changeMonth(1)" class="p-2 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-500 dark:text-zinc-400 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>
    </div>

    <div class="bg-white dark:bg-zinc-900 rounded-xl border border-zinc-200 dark:border-zinc-800 shadow-sm overflow-hidden">
        <div class="grid grid-cols-7 border-b border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-black">
            <template x-for="day in ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']">
                <div class="py-3 text-center text-xs font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider" x-text="day"></div>
            </template>
        </div>
        <div class="grid grid-cols-7 auto-rows-fr">
            <template x-for="day in calendarDays" :key="day.date">
                <div @click="selectDate(day.date)"
                     class="min-h-[100px] p-2 border-b border-r border-zinc-200 dark:border-zinc-800 hover:bg-zinc-100 dark:hover:bg-black transition-colors cursor-pointer relative"
                     :class="{ 'bg-zinc-100/30 dark:bg-zinc-800/30': isToday(day.date), 'opacity-40': !day.isCurrentMonth }">
                    <div class="flex items-center justify-center mb-1">
                        <span class="text-sm font-medium w-7 h-7 flex items-center justify-center"
                              :class="isToday(day.date) ? 'bg-zinc-100 text-zinc-900 rounded-full' : 'text-zinc-700 dark:text-zinc-300'" x-text="day.dayNum"></span>
                    </div>
                    <div class="space-y-1">
                        <template x-if="day.events.topics > 0">
                            <div class="flex items-center gap-1 text-[10px] bg-zinc-100 dark:bg-zinc-800 text-zinc-900 dark:text-white px-1.5 py-0.5 rounded truncate font-medium">
                                <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                                <span x-text="day.events.topics + ' topic' + (day.events.topics > 1 ? 's' : '')"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <div x-show="showModal" class="fixed inset-0 bg-zinc-100/40 backdrop-blur-sm flex items-center justify-center z-50" x-cloak>
        <div class="bg-white dark:bg-zinc-900 rounded-xl shadow-panel p-6 max-w-md w-full mx-4" @click.away="showModal = false">
            <h3 class="text-lg font-semibold text-zinc-900 dark:text-white mb-4" x-text="'Assign Topic to ' + formatDate(selectedDate)"></h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-1.5">Select Topic</label>
                    <select x-model="selectedTopicId" class="w-full bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg py-2.5 px-3 text-sm text-zinc-900 dark:text-white focus:border-zinc-400 focus:ring-2 focus:ring-zinc-400/20 outline-none transition-all">
                        <option value="">Choose a topic...</option>
                        <template x-for="topic in available.topics" :key="topic.id">
                            <option :value="topic.id" x-text="topic.title"></option>
                        </template>
                    </select>
                </div>
                <div class="flex items-center gap-3 pt-2">
                    <button @click="showModal = false" class="flex-1 px-4 py-2.5 border border-zinc-200 dark:border-zinc-700 rounded-lg text-sm font-medium text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-black transition-colors">Cancel</button>
                    <button @click="assignTopic" class="flex-1 px-4 py-2.5 bg-zinc-100 hover:bg-zinc-200 text-zinc-900 rounded-lg text-sm font-medium transition-colors shadow-sm">Assign</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
{% endblock %}
