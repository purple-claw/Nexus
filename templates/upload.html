{% extends 'base.html' %}
{% block content %}
<div class="max-w-7xl mx-auto h-[calc(100vh-8rem)] flex flex-col" x-data="uploadApp()">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-zinc-900 dark:text-white tracking-tight">Upload XML</h1>
            <p class="text-sm text-zinc-500 dark:text-zinc-400 mt-1">Parse structured XML into organized study material</p>
        </div>
        <div class="flex items-center gap-3">
            <button @click="loadSample()" class="inline-flex items-center gap-2 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 hover:bg-black text-zinc-700 dark:text-zinc-300 text-sm font-medium px-4 py-2 rounded-lg transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Load Sample
            </button>
            <label class="cursor-pointer inline-flex items-center gap-2 bg-zinc-100 hover:bg-zinc-200 text-zinc-900 text-sm font-medium px-4 py-2 rounded-lg transition-colors shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                Upload File
                <input type="file" accept=".xml" class="hidden" @change="handleFileUpload($event)">
            </label>
        </div>
    </div>

    <div class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-6 min-h-0">
        <div class="bg-white dark:bg-zinc-900 rounded-xl border border-zinc-200 dark:border-zinc-800 shadow-sm flex flex-col overflow-hidden">
            <div class="px-5 py-4 border-b border-zinc-200 dark:border-zinc-800 flex items-center justify-between">
                <h3 class="text-sm font-semibold text-zinc-900 dark:text-white flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-sky-500"></span>
                    XML Source
                </h3>
                <span class="text-xs text-zinc-400 dark:text-zinc-500" x-text="xmlContent.length + ' characters'"></span>
            </div>
            <div class="flex-1 p-4 overflow-hidden">
                <textarea x-model="xmlContent" @input="debouncedParse()"
                    class="w-full h-full resize-none border-0 focus:ring-0 font-mono text-xs leading-relaxed text-zinc-700 dark:text-zinc-300 p-3 bg-black rounded-lg placeholder:text-zinc-400 dark:placeholder:text-zinc-500"
                    placeholder="<document>&#10;  <metadata>&#10;    <title>Topic Title</title>&#10;    ...&#10;  </metadata>&#10;  ...&#10;</document>"></textarea>
            </div>
            <div class="p-4 border-t border-zinc-200 dark:border-zinc-800">
                <button @click="saveToDatabase()" :disabled="isSaving || !xmlContent.trim()"
                    class="w-full bg-zinc-100 hover:bg-zinc-200 text-zinc-900 text-sm font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <template x-if="isSaving">
                        <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    </template>
                    <span x-text="isSaving ? 'Saving...' : 'Parse & Save'"></span>
                </button>
            </div>
        </div>

        <div class="bg-white dark:bg-zinc-900 rounded-xl border border-zinc-200 dark:border-zinc-800 shadow-sm flex flex-col overflow-hidden">
            <div class="px-5 py-4 border-b border-zinc-200 dark:border-zinc-800 flex items-center justify-between">
                <h3 class="text-sm font-semibold text-zinc-900 dark:text-white">Preview</h3>
                <div class="flex items-center gap-2">
                    <template x-if="preview.reading.length">
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 text-xs font-medium">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                            <span x-text="preview.reading.length"></span>
                        </span>
                    </template>
                    <template x-if="preview.formulas.length">
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 text-xs font-medium">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                            <span x-text="preview.formulas.length"></span>
                        </span>
                    </template>
                    <template x-if="preview.mcqs.length">
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 text-xs font-medium">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                            <span x-text="preview.mcqs.length"></span>
                        </span>
                    </template>
                    <template x-if="preview.todos.length">
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 text-xs font-medium">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                            <span x-text="preview.todos.length"></span>
                        </span>
                    </template>
                </div>
            </div>
            <div class="flex-1 p-5 overflow-y-auto space-y-4">
                <template x-if="parseError">
                    <div class="p-4 bg-rose-50 border border-rose-200 rounded-lg text-zinc-700 dark:text-zinc-300 text-sm">
                        <p class="font-medium">XML Parse Error</p>
                        <p class="mt-1" x-text="parseError"></p>
                    </div>
                </template>

                <template x-if="!parseError && preview.metadata.title">
                    <div class="p-4 bg-black rounded-lg border border-zinc-200 dark:border-zinc-800">
                        <p class="text-xs font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider mb-2">Topic</p>
                        <h4 class="text-base font-bold text-zinc-900 dark:text-white" x-text="preview.metadata.title"></h4>
                        <p class="text-sm text-zinc-700 dark:text-zinc-300 mt-1" x-text="preview.metadata.description"></p>
                        <div class="flex items-center gap-2 mt-3">
                            <span class="inline-flex items-center px-2 py-0.5 rounded-md bg-zinc-100 dark:bg-zinc-800 text-zinc-900 dark:text-white text-xs font-medium" x-text="preview.metadata.category"></span>
                            <template x-if="preview.metadata.subcategory">
                                <span class="inline-flex items-center px-2 py-0.5 rounded-md bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 text-xs font-medium" x-text="'→ ' + preview.metadata.subcategory"></span>
                            </template>
                        </div>
                    </div>
                </template>

                <template x-for="(block, idx) in preview.reading" :key="'r'+idx">
                    <div class="p-4 bg-zinc-100/50 dark:bg-zinc-800/50 rounded-lg border border-blue-100">
                        <div class="flex items-center gap-1.5 mb-1.5">
                            <svg class="w-3.5 h-3.5 text-zinc-700 dark:text-zinc-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                            <span class="text-xs font-semibold text-zinc-700 dark:text-zinc-300" x-text="'Reading: ' + block.title"></span>
                        </div>
                        <p class="text-sm text-zinc-700 dark:text-zinc-300 line-clamp-3" x-text="block.content"></p>
                    </div>
                </template>

                <template x-for="(f, idx) in preview.formulas" :key="'f'+idx">
                    <div class="p-4 bg-zinc-100/50 dark:bg-zinc-800/50 rounded-lg border border-zinc-200 dark:border-zinc-700">
                        <div class="flex items-center gap-1.5 mb-1.5">
                            <svg class="w-3.5 h-3.5 text-zinc-700 dark:text-zinc-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                            <span class="text-xs font-semibold text-zinc-700 dark:text-zinc-300" x-text="'Formula: ' + f.title"></span>
                        </div>
                            <code class="text-sm text-zinc-900 dark:text-white font-mono" x-text="f.content"></code>
                    </div>
                </template>

                <template x-for="(q, idx) in preview.mcqs" :key="'q'+idx">
                    <div class="p-4 bg-zinc-100/50 dark:bg-zinc-800/50 rounded-lg border border-amber-100">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-1.5">
                                <svg class="w-3.5 h-3.5 text-zinc-700 dark:text-zinc-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                                <span class="text-xs font-semibold text-zinc-700 dark:text-zinc-300">MCQ</span>
                            </div>
                            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium bg-amber-200 text-zinc-700 dark:text-zinc-300" x-text="q.difficulty.toUpperCase()"></span>
                        </div>
                        <p class="text-sm font-medium text-zinc-900 dark:text-white mb-2" x-text="q.question"></p>
                        <div class="space-y-1">
                            <template x-for="opt in q.options" :key="opt.key">
                                <div class="text-xs p-2 bg-white dark:bg-zinc-900 rounded border border-zinc-200 dark:border-zinc-800 text-zinc-700 dark:text-zinc-300 flex items-center gap-2">
                                    <span class="font-semibold" x-text="opt.key + ')'"></span>
                                    <span x-text="opt.text"></span>
                                </div>
                            </template>
                        </div>
                        <p class="text-xs text-zinc-400 dark:text-zinc-500 mt-2 italic">Answer hidden until saved.</p>
                    </div>
                </template>

                <template x-for="(t, idx) in preview.todos" :key="'t'+idx">
                    <div class="p-3 bg-zinc-100/50 dark:bg-zinc-800/50 rounded-lg border border-zinc-200 dark:border-zinc-700 flex items-center gap-2.5">
                        <div class="w-4 h-4 rounded border-2 border-zinc-300 dark:border-zinc-600 shrink-0"></div>
                        <span class="text-sm text-zinc-700 dark:text-zinc-300" x-text="t.content"></span>
                    </div>
                </template>

                <template x-if="!parseError && !preview.metadata.title && xmlContent.trim()">
                    <div class="flex flex-col items-center justify-center h-32 text-zinc-400 dark:text-zinc-500">
                        <p class="text-sm">Waiting for valid XML structure...</p>
                    </div>
                </template>

                <template x-if="!xmlContent.trim()">
                    <div class="flex flex-col items-center justify-center h-full text-zinc-400 dark:text-zinc-500">
                        <svg class="w-14 h-14 mb-4 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <p class="text-sm font-medium">Enter XML or upload a file to see preview</p>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/upload.js') }}"></script>
{% endblock %}
