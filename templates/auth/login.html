{% extends "base.html" %}
{% block title %}Log In — Nexus{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-sky-500 to-blue-600 shadow-lg shadow-sky-500/20 mb-4">
        <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      </div>
      <h1 class="text-2xl font-bold text-zinc-900 dark:text-white">Welcome Back</h1>
      <p class="text-zinc-500 dark:text-zinc-400 mt-1 text-sm">Sign in to your study dashboard</p>
    </div>

    <div class="bg-white dark:bg-zinc-900 rounded-xl border border-zinc-200 dark:border-zinc-800 p-6 shadow-xl">
      <form method="POST" class="space-y-4">
        {% if error %}
        <div class="flex items-center gap-2.5 bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800/40 text-rose-600 dark:text-rose-300 text-sm rounded-lg px-4 py-3">
          <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        <div>
          <label for="username" class="block text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-1.5">Username</label>
          <input type="text" name="username" id="username" value="{{ username or '' }}" required
                 class="w-full bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3.5 py-2.5 text-zinc-900 dark:text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-sky-500/40 focus:border-sky-500/60 text-sm">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-1.5">Password</label>
          <input type="password" name="password" id="password" required
                 class="w-full bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-lg px-3.5 py-2.5 text-zinc-900 dark:text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-sky-500/40 focus:border-sky-500/60 text-sm">
        </div>
        <button type="submit"
                class="w-full bg-sky-600 hover:bg-sky-500 text-white font-medium rounded-lg px-4 py-2.5 text-sm transition-colors">
          Log In
        </button>
      </form>
    </div>

    <p class="text-center mt-6 text-sm text-zinc-400 dark:text-zinc-500">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" class="text-sky-400 hover:text-sky-300 font-medium">Register</a>
    </p>
  </div>
</div>
{% endblock %}
