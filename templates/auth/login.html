{% extends "base.html" %}
{% block title %}Log In — Nexus{% endblock %}
{% block content %}
<div class="page-enter min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-sky-500 to-blue-600 shadow-lg shadow-sky-500/20 mb-4">
        <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      </div>
      <h1 class="text-2xl font-bold text-default">Welcome Back</h1>
      <p class="text-muted mt-1 text-sm">Sign in to your study dashboard</p>
    </div>

    <div class="card p-6">
      <form method="POST" class="space-y-4">
        {% if error %}
        <div class="bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800/40 text-rose-600 dark:text-rose-400 text-sm rounded-lg px-4 py-3">
          {{ error }}
        </div>
        {% endif %}

        <div>
          <label for="username" class="block text-sm font-medium text-default mb-1.5">Username</label>
          <input type="text" name="username" id="username" value="{{ username or '' }}" required
                 class="w-full bg-transparent border border-default rounded-lg px-3.5 py-2.5 text-sm text-default placeholder:text-muted focus:outline-none focus:ring-2 focus:ring-sky-500/30 focus:border-sky-500">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-default mb-1.5">Password</label>
          <input type="password" name="password" id="password" required
                 class="w-full bg-transparent border border-default rounded-lg px-3.5 py-2.5 text-sm text-default placeholder:text-muted focus:outline-none focus:ring-2 focus:ring-sky-500/30 focus:border-sky-500">
        </div>
        <button type="submit" class="btn btn-primary w-full">
          Log In
        </button>
      </form>
    </div>

    <p class="text-center mt-6 text-sm text-muted">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" class="text-sky-400 hover:text-sky-300 font-medium">Register</a>
    </p>
  </div>
</div>
{% endblock %}
