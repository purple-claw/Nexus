{% extends "base.html" %}
{% block title %}Register — Nexus{% endblock %}
{% block content %}
<div class="page-enter min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-500 to-green-600 shadow-lg shadow-emerald-500/20 mb-4">
        <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
      </div>
      <h1 class="text-2xl font-bold text-default">Create Account</h1>
      <p class="text-muted mt-1 text-sm">Join Nexus to organize your studies</p>
    </div>

    <div class="card p-6">
      <form method="POST" class="space-y-4">
        {% for err in errors %}
        <div class="bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800/40 text-rose-600 dark:text-rose-400 text-sm rounded-lg px-4 py-3">
          {{ err }}
        </div>
        {% endfor %}

        <div>
          <label for="username" class="block text-sm font-medium text-default mb-1.5">Username</label>
          <input type="text" name="username" id="username" value="{{ username or '' }}" required
                 class="w-full bg-transparent border border-default rounded-lg px-3.5 py-2.5 text-sm text-default placeholder:text-muted focus:outline-none focus:ring-2 focus:ring-sky-500/30 focus:border-sky-500">
        </div>
        <div>
          <label for="email" class="block text-sm font-medium text-default mb-1.5">Email</label>
          <input type="email" name="email" id="email" value="{{ email or '' }}" required
                 class="w-full bg-transparent border border-default rounded-lg px-3.5 py-2.5 text-sm text-default placeholder:text-muted focus:outline-none focus:ring-2 focus:ring-sky-500/30 focus:border-sky-500">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-default mb-1.5">Password</label>
          <input type="password" name="password" id="password" required
                 class="w-full bg-transparent border border-default rounded-lg px-3.5 py-2.5 text-sm text-default placeholder:text-muted focus:outline-none focus:ring-2 focus:ring-sky-500/30 focus:border-sky-500">
        </div>
        <div>
          <label for="confirm" class="block text-sm font-medium text-default mb-1.5">Confirm Password</label>
          <input type="password" name="confirm_password" id="confirm" required
                 class="w-full bg-transparent border border-default rounded-lg px-3.5 py-2.5 text-sm text-default placeholder:text-muted focus:outline-none focus:ring-2 focus:ring-sky-500/30 focus:border-sky-500">
        </div>
        <button type="submit" class="btn btn-primary w-full">
          Create Account
        </button>
      </form>
    </div>

    <p class="text-center mt-6 text-sm text-muted">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="text-sky-400 hover:text-sky-300 font-medium">Log In</a>
    </p>
  </div>
</div>
{% endblock %}
