<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}Nexus{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7',700:'#0369a1',800:'#075985',900:'#0c4a6e',950:'#082f49' }
          },
          boxShadow: {
            'card': '0 1px 3px 0 rgba(0,0,0,0.04), 0 1px 2px -1px rgba(0,0,0,0.04)',
            'card-hover': '0 8px 24px rgba(0,0,0,0.08)',
            'panel': '0 4px 24px rgba(0,0,0,0.12)',
          }
        }
      }
    }
  </script>
  <script>
    (function() {
      const stored = localStorage.getItem('nexus-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark' || (!stored && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  {% block head %}{% endblock %}
</head>
<body class="antialiased min-h-screen">
  <div x-data="{ sidebarOpen: false }" class="min-h-screen flex flex-col">
    {% if current_user.is_authenticated %}
    <div class="flex min-h-screen">
      {% include "components/sidebar.html" %}
      <div class="flex-1 flex flex-col lg:ml-64 min-w-0">
        {% include "components/header.html" %}
        <main class="flex-1 page-container py-6 w-full max-w-7xl mx-auto page-enter">
          {{ self.content() }}
        </main>
      </div>
    </div>
    {% include "components/toast.html" %}
    {% else %}
    <main class="flex-1 page-enter">
      {{ self.content() }}
    </main>
    {% endif %}
  </div>
  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.contains('dark');
      html.classList.toggle('dark');
      localStorage.setItem('nexus-theme', isDark ? 'light' : 'dark');
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
