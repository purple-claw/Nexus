{% extends 'base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto page-enter" x-data="mcqPractice()" @keydown="handleKey($event)">
    <div class="flex items-center justify-between mb-6">
        <a href="/mcq/" class="btn btn-ghost">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Exit Practice
        </a>
        <div class="flex items-center gap-4" x-show="!loading && questions.length && !sessionComplete">
            <span class="text-sm text-default">
                <span class="font-semibold text-default" x-text="score"></span>
                <span class="text-subtle">/</span>
                <span x-text="totalAnswered"></span>
                <span class="text-subtle ml-1">correct</span>
            </span>
            <div class="w-32 h-2 surface-elevated rounded-full overflow-hidden">
                <div class="h-full bg-accent rounded-full transition-all duration-300" :style="'width: ' + progressPercent + '%'"></div>
            </div>
            <span class="text-xs text-subtle w-16 text-right" x-text="(currentIndex + 1) + '/' + questions.length"></span>
        </div>
    </div>

    <div x-show="loading" class="card flex items-center justify-center py-32">
        <div class="flex flex-col items-center gap-3 text-muted">
            <svg class="animate-spin w-6 h-6" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <span class="text-sm font-medium">Loading questions...</span>
        </div>
    </div>

    <div x-show="!loading && !questions.length && !sessionComplete" class="card flex flex-col items-center justify-center py-24 px-6">
        <div class="w-14 h-14 rounded-xl surface-hover flex items-center justify-center mb-4">
            <svg class="w-7 h-7 text-subtle" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
        </div>
        <p class="text-sm font-medium text-default">No questions available</p>
        <p class="text-xs text-muted mt-1">Upload XML content with MCQs to start a practice session.</p>
        <a href="/upload/" class="btn btn-primary mt-4">Upload XML</a>
    </div>

    <template x-if="!loading && questions.length && !sessionComplete">
        <div class="card overflow-hidden" x-transition:enter.duration.300ms>
            <div class="p-6 sm:p-8">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-2">
                        <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium"
                              :class="{
                                  'bg-emerald-900/40 text-emerald-300': currentQuestion.difficulty === 'easy',
                                  'bg-amber-900/40 text-amber-300': currentQuestion.difficulty === 'medium',
                                  'bg-rose-900/40 text-rose-300': currentQuestion.difficulty === 'hard',
                                  'surface-hover text-muted': !currentQuestion.difficulty
                              }" x-text="currentQuestion.difficulty || 'medium'"></span>
                        <span class="text-xs text-subtle">#<span x-text="currentQuestion.id"></span></span>
                    </div>
                    <button @click="toggleBookmark" class="text-subtle hover:text-amber-400 transition-colors" :title="bookmarked ? 'Remove bookmark' : 'Bookmark this question'">
                        <svg class="w-5 h-5" :class="bookmarked ? 'fill-amber-400 text-amber-400' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                    </button>
                </div>

                <h2 class="text-lg font-semibold text-default mb-8 leading-relaxed" x-text="currentQuestion.question"></h2>

                <div class="space-y-3">
                    <template x-for="(option, idx) in currentQuestion.options" :key="idx">
                        <button @click="selectAnswer(option.key)"
                                class="w-full text-left p-4 rounded-xl border-2 transition-all duration-200 flex items-start gap-4 focus:outline-none focus:ring-2 focus:ring-accent/30"
                                :class="optionClasses(option.key)"
                                :disabled="answered"
                                :id="'opt-' + option.key">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold shrink-0 transition-colors"
                                 :class="indicatorClasses(option.key)"
                                 x-text="option.key"></div>
                            <div class="pt-1 min-w-0 flex-1">
                                <span class="text-sm" :class="textClasses(option.key)" x-text="option.text"></span>
                                <span x-show="answered && option.key === currentQuestion.answer" class="ml-2 text-xs font-semibold text-muted">✓ Correct answer</span>
                            </div>
                        </button>
                    </template>
                </div>

                <div x-show="answered" class="mt-2 text-xs text-subtle text-center">
                    <span x-show="currentQuestion.options.length === 4">Keyboard: press <kbd class="px-1 py-0.5 surface-hover rounded text-[10px] font-mono font-bold">1</kbd>-<kbd class="px-1 py-0.5 surface-hover rounded text-[10px] font-mono font-bold">4</kbd> for options</span>
                </div>
            </div>

            <div x-show="answered" x-transition class="divide-y divide-default">
                <div class="p-6">
                    <div class="flex items-start gap-3 mb-5">
                        <div class="p-2 rounded-lg shrink-0" :class="isCurrentCorrect ? 'bg-emerald-900/60' : 'bg-rose-900/60'">
                            <svg x-show="isCurrentCorrect" class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <svg x-show="!isCurrentCorrect" class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <div class="min-w-0 flex-1">
                            <p class="text-sm font-semibold" :class="isCurrentCorrect ? 'text-emerald-300' : 'text-rose-300'">
                                <span x-text="isCurrentCorrect ? 'Correct!' : 'Incorrect'"></span>
                                <span class="font-normal" x-text="' — The answer is ' + currentQuestion.answer"></span>
                            </p>
                            <p x-show="currentQuestion.explanation" class="text-sm text-muted mt-2 leading-relaxed" x-text="currentQuestion.explanation"></p>
                        </div>
                    </div>

                    <div class="flex items-center justify-between gap-3">
                        <button @click="prevQuestion" x-show="currentIndex > 0"
                                class="btn btn-ghost">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Previous
                        </button>
                        <div class="flex-1"></div>
                        <button @click="nextQuestion"
                                class="btn btn-primary">
                            <span x-text="currentIndex < questions.length - 1 ? 'Next' : 'Finish'"></span>
                            <svg x-show="currentIndex < questions.length - 1" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template x-if="!loading && sessionComplete">
        <div class="card overflow-hidden" x-transition:enter.duration.400ms>
            <div class="p-8 sm:p-10 text-center">
                <div class="w-16 h-16 rounded-2xl mx-auto mb-5 flex items-center justify-center"
                     :class="accuracy >= 70 ? 'bg-emerald-900/40' : accuracy >= 40 ? 'bg-amber-900/40' : 'bg-rose-900/40'">
                    <svg class="w-8 h-8" :class="accuracy >= 70 ? 'text-emerald-400' : accuracy >= 40 ? 'text-amber-400' : 'text-rose-400'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h2 class="text-xl font-bold text-default mb-2">Session Complete!</h2>
                <p class="text-sm text-muted mb-6">Here's how you performed</p>

                <div class="grid grid-cols-3 gap-4 max-w-sm mx-auto mb-8">
                    <div class="p-4 rounded-xl card">
                        <p class="text-2xl font-bold text-default" x-text="totalAnswered"></p>
                        <p class="text-xs text-subtle mt-0.5">Answered</p>
                    </div>
                    <div class="p-4 rounded-xl bg-emerald-900/40 border border-emerald-800/50">
                        <p class="text-2xl font-bold text-emerald-300" x-text="score"></p>
                        <p class="text-xs text-emerald-400 mt-0.5">Correct</p>
                    </div>
                    <div class="p-4 rounded-xl" :class="accuracy >= 70 ? 'bg-emerald-900/40 border border-emerald-800/50' : accuracy >= 40 ? 'bg-amber-900/40 border border-amber-800/50' : 'bg-rose-900/40 border border-rose-800/50'">
                        <p class="text-2xl font-bold" :class="accuracy >= 70 ? 'text-emerald-300' : accuracy >= 40 ? 'text-amber-300' : 'text-rose-300'" x-text="accuracy + '%'"></p>
                        <p class="text-xs mt-0.5" :class="accuracy >= 70 ? 'text-emerald-400' : accuracy >= 40 ? 'text-amber-400' : 'text-rose-400'">Accuracy</p>
                    </div>
                </div>

                <div class="w-full h-2 surface-elevated rounded-full overflow-hidden max-w-sm mx-auto mb-8">
                    <div class="h-full rounded-full transition-all duration-500" :style="'width: ' + accuracy + '%'" :class="accuracy >= 70 ? 'bg-emerald-500' : accuracy >= 40 ? 'bg-amber-500' : 'bg-rose-500'"></div>
                </div>

                <div class="flex items-center justify-center gap-3">
                    <button @click="restartSession" class="btn btn-ghost">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Practice Again
                    </button>
                    <a href="/mcq/" class="btn btn-primary">
                        Back to Browse
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </a>
                </div>
            </div>
        </div>
    </template>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/mcq.js') }}"></script>
{% endblock %}
