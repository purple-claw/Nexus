<header class="sticky top-0 z-30 border-b border-default" style="background-color: var(--bg-header); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem;">
  <div class="flex items-center gap-3">
    <button @click="sidebarOpen = true" class="lg:hidden p-2 rounded-lg text-muted hover:surface-elevated transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>

  <div class="flex items-center gap-2">
    <button onclick="toggleTheme()"
            class="theme-btn p-2 rounded-lg text-muted hover:surface-elevated transition-colors"
            title="Toggle theme">
      <svg class="w-5 h-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
      </svg>
      <svg class="w-5 h-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
    </button>
    <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg surface-card border-default border">
      <div class="w-6 h-6 rounded-full bg-gradient-to-br from-sky-500 to-blue-600 flex items-center justify-center">
        <span class="text-xs font-bold text-white">{{ current_user.username[0]|upper }}</span>
      </div>
      <span class="text-sm text-default hidden sm:inline">{{ current_user.username }}</span>
    </div>
    <a href="{{ url_for('auth.logout') }}"
       class="p-2 rounded-lg text-muted hover:surface-elevated transition-colors" title="Log out">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
    </a>
  </div>
</header>
