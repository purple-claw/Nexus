<a href="/topic/{{ topic.id }}/" class="flex items-center justify-between px-4 py-3 rounded-lg hover:bg-black transition-colors group border border-transparent hover:border-zinc-800">
    <div class="flex items-center gap-3 min-w-0">
        <div class="w-7 h-7 rounded-md bg-zinc-800 flex items-center justify-center shrink-0 group-hover:bg-zinc-800 transition-colors">
            <svg class="w-3.5 h-3.5 text-zinc-400 group-hover:text-zinc-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <span class="text-sm font-medium text-zinc-300 group-hover:text-white transition-colors truncate">{{ topic.title }}</span>
    </div>
    <div class="flex items-center gap-2 shrink-0">
        {% if topic.mcq_count > 0 %}
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-amber-900/40 text-amber-300 text-xs font-medium" title="MCQs">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
            {{ topic.mcq_count }}
        </span>
        {% endif %}
        {% if topic.reading_count > 0 %}
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-sky-900/40 text-sky-300 text-xs font-medium" title="Reading">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            {{ topic.reading_count }}
        </span>
        {% endif %}
        {% if topic.formula_count > 0 %}
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-violet-900/40 text-violet-300 text-xs font-medium" title="Formulas">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
            {{ topic.formula_count }}
        </span>
        {% endif %}
        {% if topic.note_count > 0 %}
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-emerald-900/40 text-emerald-300 text-xs font-medium" title="Notes">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            {{ topic.note_count }}
        </span>
        {% endif %}
    </div>
</a>
