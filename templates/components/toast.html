<div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none">
</div>

<script>
function showToast(message, type = 'success') {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.style.animation = 'slideIn 0.3s ease-out forwards';

    let icon = '';
    if (type === 'success') {
        icon = '<svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
    } else if (type === 'error') {
        icon = '<svg class="w-5 h-5 text-rose-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
    }

    const span = document.createElement('span');
    span.className = 'text-sm text-default';
    span.textContent = message;

    toast.innerHTML = icon;
    toast.appendChild(span);
    container.appendChild(toast);

    setTimeout(() => {
        toast.style.animation = 'slideOut 0.3s ease-in forwards';
        setTimeout(() => toast.remove(), 300);
    }, 4000);
}

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
setTimeout(function() {
    {% for category, message in messages %}
    showToast({{ message|tojson|safe }}, {{ category|tojson|safe }});
    {% endfor %}
}, 100);
{% endif %}
{% endwith %}
</script>
