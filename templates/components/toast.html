<div x-data="{ toasts: [] }" x-init="
    window.showToast = function(message, type = 'success') {
        const id = Date.now();
        toasts.push({ id, message, type, hiding: false });
        setTimeout(() => {
            const t = toasts.find(t => t.id === id);
            if (t) t.hiding = true;
            setTimeout(() => { toasts = toasts.filter(t => t.id !== id); }, 300);
        }, 4000);
    };
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            setTimeout(() => {
                {% for category, message in messages %}
                window.showToast('{{ message|e }}', '{{ category }}');
                {% endfor %}
            }, 100);
        {% endif %}
    {% endwith %}
" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-sm">
    <template x-for="t in toasts" :key="t.id">
        <div class="toast" :class="{ 'hiding': t.hiding, 'success': t.type === 'success', 'error': t.type === 'error' }"
             :style="t.hiding ? 'animation: slideOut 0.3s ease-in forwards;' : 'animation: slideIn 0.3s ease-out forwards;'">
            <template x-if="t.type === 'success'">
                <svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </template>
            <template x-if="t.type === 'error'">
                <svg class="w-5 h-5 text-rose-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </template>
            <span class="text-sm text-zinc-200" x-text="t.message"></span>
        </div>
    </template>
</div>
