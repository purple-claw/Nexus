{% extends 'base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <a href="/reading/" class="inline-flex items-center gap-2 text-slate-500 hover:text-slate-800 mb-6 text-sm font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Back to Library
    </a>
    <div class="mb-4">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">{{ topic_title }}</span>
        <h1 class="text-3xl font-bold text-slate-900 mt-1">{{ title }}</h1>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8 prose prose-slate max-w-none">
        {{ content | replace('\n', '<br>') | safe }}
    </div>
</div>
{% endblock %}
