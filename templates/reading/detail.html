{% extends 'base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6 page-enter">
    <nav class="flex items-center gap-2 text-sm text-muted">
        <a href="/reading/" class="hover:text-default transition-colors">Reading Library</a>
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        <span class="text-default font-medium truncate">{{ title }}</span>
    </nav>

    <div class="card overflow-hidden">
        <div class="px-6 py-5 border-b border-default">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md surface-hover text-muted text-xs font-medium">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                {{ topic_title }}
            </span>
            <h1 class="text-xl font-bold text-default mt-2">{{ title }}</h1>
        </div>
        <div class="p-6 sm:p-8 prose prose-sm max-w-none text-default">
            {{ content | replace('\n', '<br>') | safe }}
        </div>
    </div>

    <a href="/reading/" class="btn btn-ghost">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        Back to Reading Library
    </a>
</div>
{% endblock %}
