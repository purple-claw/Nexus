databases:
  - name: nexus-db
    plan: free
    region: oregon

services:
  - type: web
    name: nexus
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
